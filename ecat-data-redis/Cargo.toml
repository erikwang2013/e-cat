[package]
name = "ecat-data-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Redis cache client for e-cat"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ecat-data = { version = "4.1.0", path = "../ecat-data" }
ecat-errors.workspace = true
ecat-lock = { version = "4.1.0", path = "../ecat-lock" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
uuid = { version = "1", features = ["v4"] }
ecat-tls = { version = "4.1.0", path = "../ecat-tls" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
