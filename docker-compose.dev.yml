# 本地联调用。不进 CI。三种形态用 profile 选择：
#   docker compose --profile dev up          # 原三库联调：MSSQL / PostgreSQL / MySQL 8.0
#   docker compose --profile standalone up   # 单机：MySQL 8.4 + Redis
#   docker compose --profile distributed up  # 分布式：MySQL + Redis + ClickHouse + 代理 + 2 app
# 注意：旧的三库已收进 dev profile，`docker compose up` 不再默认起它们。
services:
  mssql:
    profiles: [dev]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Ecat_Test_2026!"
      MSSQL_PID: Developer
    ports: ["1433:1433"]
  postgres:
    profiles: [dev]
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
  mysql:
    profiles: [dev]
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: bee_test }
    ports: ["3306:3306"]

  # 两个 profile 共用主库/缓存；distributed 的 MySQL 镜像可用 ECAT_MYSQL_VERSION=9 切到 9。
  # shortcut: 代理分片配置未随本清单挂载（见 scripts/sharding），distributed 只起拓扑，
  # 真分片路由需补配置。
  ecat-mysql:
    profiles: [standalone, distributed]
    image: "mysql:${ECAT_MYSQL_VERSION:-8.4}"
    environment:
      MYSQL_ROOT_PASSWORD: ${ECAT_MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: bee_test
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${ECAT_MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 30
  ecat-redis:
    profiles: [standalone, distributed]
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    profiles: [distributed]
    image: clickhouse/clickhouse-server:24.8-alpine
    ports: ["8123:8123", "9000:9000"]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  shardingsphere-proxy:
    profiles: [distributed]
    image: apache/shardingsphere-proxy:5.5.1
    ports: ["3308:3307"]
    depends_on:
      ecat-mysql: { condition: service_healthy }
    healthcheck:
      # 镜像无 mysql 客户端，用 bash 的 /dev/tcp 探代理监听端口。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3307"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
  app-1:
    profiles: [distributed]
    build: { context: ., dockerfile: ecat-deploy/Dockerfile }
    image: ecat-app:latest
    environment:
      ECAT_DEPLOYMENT_MODE: distributed
      ECAT_NODE_ID: app-1
      RUST_LOG: info
    ports: ["8001:8000", "9001:9000"]
    depends_on:
      ecat-redis: { condition: service_healthy }
      shardingsphere-proxy: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  app-2:
    profiles: [distributed]
    build: { context: ., dockerfile: ecat-deploy/Dockerfile }
    image: ecat-app:latest
    environment:
      ECAT_DEPLOYMENT_MODE: distributed
      ECAT_NODE_ID: app-2
      RUST_LOG: info
    ports: ["8002:8000", "9002:9000"]
    depends_on:
      ecat-redis: { condition: service_healthy }
      shardingsphere-proxy: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
