[package]
name = "ecat-data-trino"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trino distributed SQL query engine client for e-cat"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ecat-data = { version = "8.0.0", path = "../ecat-data" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ecat-tls = { version = "8.0.0", path = "../ecat-tls" }
# 出站熔断：逐 client 一个 Breaker。
ecat-circuit-breaker.workspace = true
# 并发上限用 Semaphore（tokio 默认只在 dev-dependencies）。
tokio = { workspace = true, features = ["sync"] }
# 指标依赖 optional：默认不把 axum（ecat-metrics 的依赖）拖进核心依赖树。
ecat-metrics = { workspace = true, optional = true }

[features]
metrics = ["dep:ecat-metrics"]

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "time"] }
