# e-cat 数据库配置示例 — v6.0.0
#
# 每个数据库后端都有 XxxConfig + from_config() 方法。
# username / password / tls 均为可选字段，省略则跳过。
#
# 📖 教程:
#   docs/database-config-tutorial.md    — 数据库配置
#   docs/tls-certificate-tutorial.md    — TLS 证书认证
#
# TLS 证书可通过 ecat-tls 自动生成:
#   use ecat_tls::{generate_ca, generate_server_cert, generate_client_cert};
#   let ca = generate_ca("MyOrg").unwrap();
#   let srv = generate_server_cert("db.internal").unwrap();
#   std::fs::write("ca.pem", ca.cert_pem).unwrap();

# ── RDBMS ───────────────────────────────────────────────────
sql:
  # SQLite / PostgreSQL / MySQL / TiDB 统一使用 sqlx 连接串
  url: "postgres://localhost:5432/myapp"
  # username: "app_user"     # 可选: 嵌入 URL 认证（与 password 配合）
  # password: "changeme"     # 可选

# ── SQL Server ──────────────────────────────────────────────
mssql:
  # URL 形态：mssql://user:pass@host:1433/db
  #   自签证书时加查询串：mssql://...?trustservercertificate=true
  # ADO 形态：Server=host,1433;Database=db;User Id=user;Password=pass;TrustServerCertificate=true
  url: "mssql://sa:changeme@localhost:1433/myapp"
  # username / password 可选（嵌入 URL 认证）
  # 池参数（可选）：max_connections / min_connections / acquire_timeout_secs
  #                 query_timeout_secs（0 = 禁用）/ create_timeout_secs
  # 注意：**没有** idle_timeout —— deadpool 不提供空闲回收，见 README

# ── 缓存 ────────────────────────────────────────────────────
redis:
  url: "redis://localhost:6379"
  # password: "auth_token"   # 可选: Redis AUTH
  # 出站韧性（可选）：query_timeout_secs（0 = 禁用，默认 30 秒）
  #   breaker: { failure_ratio: 0.5, window: 30, half_open_probes: 3, open_duration: 10 }
  #   max_concurrency（默认 32，本 crate 的信号量）

memcached:
  # username: "memcache"     # 可选: 保留字段（当前为内存实现）
  # password: "secret"       # 可选: 保留字段
  {}

