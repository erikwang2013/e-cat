[package]
name = "ecat-data-sqlx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLx multi-database client for e-cat"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ecat-data = { version = "9.0.0", path = "../ecat-data" }
# tls-rustls-ring：MySQL/PostgreSQL 的 `ssl-mode=REQUIRED` 需要编译期 TLS 后端；
# 缺失时 sqlx 直接报「built without TLS support」，REQUIRED 真机门必挂（复用
# ecat-tls 已引入的 rustls 0.23 + ring，不新增 TLS 栈）。
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "mysql", "time", "tls-rustls-ring"] }
time = { workspace = true }
base64 = "0.22"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
ecat-tls = { version = "9.0.0", path = "../ecat-tls" }
# 三个可观测性依赖都是 optional：默认不把 axum（ecat-metrics/ecat-health 的依赖）
# 拖进核心依赖树。
ecat-metrics = { workspace = true, optional = true }
ecat-health = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
# 三个都默认关闭（spec:717-718）。
metrics = ["dep:ecat-metrics"]
health = ["dep:ecat-health"]
tracing = ["dep:tracing"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# 慢查询 warn 的捕获断言用（`MakeWriter`）。
tracing-subscriber = { workspace = true }
