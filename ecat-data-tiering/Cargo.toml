[package]
name = "ecat-data-tiering"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hot/cold data tiering for e-cat"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "ecat-tier"
path = "src/bin/ecat-tier.rs"

[dependencies]
ecat-data = { version = "8.0.0", path = "../ecat-data" }
ecat-errors.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
# 分布式锁 trait 在 ecat-lock；本 crate 只依赖抽象，不引入 Redis 客户端。
ecat-lock = { version = "8.0.0", path = "../ecat-lock" }
# 单次运行预算：默认 pacer 的限速等待用 tokio::time::sleep；`run_until` 的 select! 需要 macros。
tokio = { workspace = true, features = ["macros", "rt", "time"] }
# DROP 前行数对账失败时告警（仓库统一日志门面）。
tracing.workspace = true
time.workspace = true
# 错误显示与 source 链（仓库内自定义错误枚举统一用它）。
thiserror.workspace = true
# `ecat-tier` bin 的参数解析。
clap = { version = "4", features = ["derive"] }
# 读取应用 YAML 配置的 `tiering:` 段（与 ecat-config 同一解析器）。
yaml_serde = "0.10"
# 冷层 sink 可选后端；默认不把 reqwest/ecat-tls 拖进默认依赖树。
ecat-data-clickhouse = { version = "8.0.0", path = "../ecat-data-clickhouse", optional = true }
ecat-data-s3 = { version = "8.0.0", path = "../ecat-data-s3", optional = true }
# 冷 chunk NDJSON 的 SHA-256（clickhouse / s3 feature 用）。
sha2 = { workspace = true, optional = true }
# 可选：`health` feature 的 readyz 探针；默认不进依赖树。
ecat-health = { workspace = true, optional = true }
# 可选：`cli` feature 的 SqlxConfig/SqlxClient 接线。
ecat-data-sqlx = { workspace = true, optional = true }

[features]
clickhouse = ["dep:ecat-data-clickhouse", "dep:sha2", "tokio/sync"]
s3 = ["dep:ecat-data-s3", "dep:sha2"]
health = ["dep:ecat-health"]
cli = ["dep:ecat-data-sqlx"]

[dev-dependencies]
# 状态机测试跑在 SQLite 内存库上。
ecat-data-sqlx.workspace = true
# 假 ClickHouse HTTP 端点（无需 live 服务）。
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net"] }
