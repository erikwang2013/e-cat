[package]
name = "ecat-data-tiering"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hot/cold data tiering for e-cat"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ecat-data = { version = "7.1.1", path = "../ecat-data" }
ecat-errors.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
# 分布式锁 trait 在 ecat-lock；本 crate 只依赖抽象，不引入 Redis 客户端。
ecat-lock = { version = "7.1.1", path = "../ecat-lock" }
# 单次运行预算：默认 pacer 的限速等待用 tokio::time::sleep。
tokio = { workspace = true, features = ["time"] }
# DROP 前行数对账失败时告警（仓库统一日志门面）。
tracing.workspace = true
time.workspace = true
# 错误显示与 source 链（仓库内自定义错误枚举统一用它）。
thiserror.workspace = true
# 冷层 sink 可选后端；默认不把 reqwest/ecat-tls 拖进默认依赖树。
ecat-data-clickhouse = { version = "7.1.1", path = "../ecat-data-clickhouse", optional = true }
ecat-data-s3 = { version = "7.1.1", path = "../ecat-data-s3", optional = true }
# 冷 chunk NDJSON 的 SHA-256（clickhouse / s3 feature 用）。
sha2 = { workspace = true, optional = true }

[features]
clickhouse = ["dep:ecat-data-clickhouse", "dep:sha2", "tokio/sync"]
s3 = ["dep:ecat-data-s3", "dep:sha2"]

[dev-dependencies]
# 状态机测试跑在 SQLite 内存库上。
ecat-data-sqlx.workspace = true
# 假 ClickHouse HTTP 端点（无需 live 服务）。
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net"] }
