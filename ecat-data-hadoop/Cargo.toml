[package]
name = "ecat-data-hadoop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hadoop WebHDFS storage client for e-cat"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ecat-data = { version = "8.0.0", path = "../ecat-data" }
ecat-errors = { version = "8.0.0", path = "../ecat-errors" }
ecat-tls = { version = "8.0.0", path = "../ecat-tls" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# 出站熔断：逐 client 一个。
ecat-circuit-breaker.workspace = true
# 并发上限用 Semaphore。
tokio = { workspace = true, features = ["sync"] }
# 指标依赖 optional：默认不把 axum（ecat-metrics 的依赖）拖进核心依赖树。
ecat-metrics = { workspace = true, optional = true }

[features]
# 三个出站指标家族的唯一 collector 在 ecat-metrics（批次 5a「出入 11」）。
metrics = ["dep:ecat-metrics"]

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "time"] }
