[workspace]
members = [
    "ecat-protos",
    "ecat-errors",
    "ecat-metadata",
    "ecat-encoding",
    "ecat-logging",
    "ecat-transport",
    "ecat-transport-http",
    "ecat-transport-grpc",
    "ecat-middleware",
    "ecat-registry",
    "ecat-config",
    "ecat-metrics",
    "ecat-data",
    "ecat-data-sqlx",
    "ecat",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tonic-build = "0.12"
tower = "0.5"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
opentelemetry = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
http = "1"
thiserror = "2"
