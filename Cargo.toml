[workspace]
members = [
    "ecat-protos",
    "ecat-errors",
    "ecat-metadata",
    "ecat-encoding",
    "ecat-lock",
    "ecat-logging",
    "ecat-transport",
    "ecat-transport-http",
    "ecat-transport-grpc",
    "ecat-middleware",
    "ecat-registry",
    "ecat-config",
    "ecat-metrics",
    "ecat-data",
    "ecat-data-sqlx",
    "ecat",
    "ecat-cli",
    "ecat-security",
    "ecat-health",
    "ecat-circuit-breaker",
    "ecat-auth",
    "ecat-client",
    "ecat-registry-consul",
    "ecat-data-redis",
    "ecat-mq",
    "ecat-events",
    "ecat-config-remote",
    "ecat-openapi",
    "ecat-bench",
    "ecat-tracing",
    "ecat-registry-etcd",
    "ecat-mq-kafka",
    "ecat-mq-rabbitmq",
    "ecat-mq-mqtt",
    "ecat-mq-nats",
    "ecat-data-opensearch",
    "ecat-data-influxdb",
    "ecat-transport-ws",
    "ecat-versioning",
    "ecat-graphql",
    "ecat-data-elasticsearch",
    "ecat-data-clickhouse",
    "ecat-data-memcached",
    "ecat-data-neo4j",
    "ecat-data-nebulagraph",
    "ecat-data-arangodb",
    "ecat-data-iotdb",
    "ecat-data-mssql",
    "ecat-data-questdb",
    "ecat-data-tdengine",
    "ecat-data-mongodb",
    "ecat-data-s3",
    "ecat-tls",
    "ecat-scheduler",
    "ecat-orm",
    "ecat-orm-derive",
    "examples/helloworld",
    "examples/databases",
    "examples/middleware",
    "examples/websocket",
]
resolver = "2"
exclude = [
    "examples/*",
]

[workspace.package]
version = "4.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/erikwang2013/e-cat"
homepage = "https://github.com/erikwang2013/e-cat"
keywords = ["web", "framework", "async", "http", "microservices"]
categories = ["web-programming::http-server", "asynchronous"]
# 不设 documentation：docs.rs 会按 crate 名自动生成 https://docs.rs/<crate>，
# 写死 workspace 级别反而会让 52 个 crate 的文档链接全部指向 ecat。


[profile.release]
lto = "thin"

[workspace.dependencies]
tokio = "1"
bytes = "1"
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tonic-build = "0.12"
tower = "0.5"
tower-http = "0.6"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
http = "1"
thiserror = "2"
futures-core = "0.3"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
# SQL Server: default-features = false 关掉 native-tls + winauth（与 rustls 栈冲突，
# winauth 还会引入 SSPI 依赖）；tds73 覆盖 SQL Server 2008+。
tiberius-ng = { version = "0.13", default-features = false, features = ["rustls", "tds73", "time"] }
deadpool = "0.13"
# compat 特性提供 compat_write()，tiberius 的 Client::connect 要求 AsyncRead + AsyncWrite。
tokio-util = { version = "0.7", features = ["compat"] }
ecat-protos={ version = "4.0.0", path = "ecat-protos" }
ecat-transport = { version = "4.0.0", path = "ecat-transport" }
ecat-transport-http = { version = "4.0.0", path = "ecat-transport-http" }
ecat-transport-grpc = { version = "4.0.0", path = "ecat-transport-grpc" }
ecat-logging = { version = "4.0.0", path = "ecat-logging" }
ecat-errors = { version = "4.0.0", path = "ecat-errors" }
ecat-middleware = { version = "4.0.0", path = "ecat-middleware" }
ecat-auth = { version = "4.0.0", path = "ecat-auth" }
ecat-client = { version = "4.0.0", path = "ecat-client" }
ecat-events = { version = "4.0.0", path = "ecat-events" }
ecat-metrics = { version = "4.0.0", path = "ecat-metrics" }
ecat-tracing = { version = "4.0.0", path = "ecat-tracing" }
ecat-circuit-breaker = { version = "4.0.0", path = "ecat-circuit-breaker" }
ecat-registry-consul = { version = "4.0.0", path = "ecat-registry-consul" }
ecat-config-remote = { version = "4.0.0", path = "ecat-config-remote" }
ecat-data-redis = { version = "4.0.0", path = "ecat-data-redis" }
# ecat-orm 走 workspace 引用：ecat-data-sqlx 只供它的 dev-dependencies 用。
ecat-data = { version = "4.0.0", path = "ecat-data" }
ecat-data-sqlx = { version = "4.0.0", path = "ecat-data-sqlx" }
ecat-orm = { version = "4.0.0", path = "ecat-orm" }
ecat-orm-derive = { version = "4.0.0", path = "ecat-orm-derive" }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
