[workspace]
members = [
    "ecat-protos",
    "ecat-errors",
    "ecat-metadata",
    "ecat-encoding",
    "ecat-lock",
    "ecat-logging",
    "ecat-transport",
    "ecat-transport-http",
    "ecat-transport-grpc",
    "ecat-middleware",
    "ecat-registry",
    "ecat-config",
    "ecat-metrics",
    "ecat-data",
    "ecat-data-sqlx",
    "ecat",
    "ecat-cli",
    "ecat-security",
    "ecat-health",
    "ecat-circuit-breaker",
    "ecat-auth",
    "ecat-client",
    "ecat-registry-consul",
    "ecat-data-redis",
    "ecat-mq",
    "ecat-events",
    "ecat-config-remote",
    "ecat-testing",
    "ecat-openapi",
    "ecat-bench",
    "ecat-tracing",
    "ecat-tracing-otlp",
    "ecat-registry-etcd",
    "ecat-mq-kafka",
    "ecat-mq-rabbitmq",
    "ecat-mq-mqtt",
    "ecat-mq-nats",
    "ecat-data-opensearch",
    "ecat-data-influxdb",
    "ecat-transport-ws",
    "ecat-versioning",
    "ecat-graphql",
    "ecat-data-elasticsearch",
    "ecat-data-clickhouse",
    "ecat-data-memcached",
    "ecat-data-neo4j",
    "ecat-data-nebulagraph",
    "ecat-data-arangodb",
    "ecat-data-iotdb",
    "ecat-data-questdb",
    "ecat-data-tdengine",
    "ecat-data-mongodb",
    "ecat-data-s3",
    "ecat-tls",
    "ecat-scheduler",
    "examples/helloworld",
]
resolver = "2"

[workspace.package]
version = "2.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/erik/e-cat"
documentation = "https://docs.rs/e-cat"


[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tonic-build = "0.12"
tower = "0.5"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
http = "1"
thiserror = "2"
futures-core = "0.3"
