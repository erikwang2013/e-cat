[workspace]
members = [
    "ecat-protos",
    "ecat-errors",
    "ecat-metadata",
    "ecat-encoding",
    "ecat-logging",
    "ecat-transport",
    "ecat-transport-http",
    "ecat-transport-grpc",
    "ecat-middleware",
    "ecat-registry",
    "ecat-config",
    "ecat-metrics",
    "ecat-data",
    "ecat-data-sqlx",
    "ecat",
    "ecat-cli",
    "ecat-security",
    "ecat-health",
    "ecat-circuit-breaker",
    "ecat-auth",
    "ecat-client",
    "ecat-registry-consul",
    "ecat-data-redis",
    "ecat-mq",
    "ecat-events",
    "ecat-config-remote",
    "ecat-testing",
    "ecat-openapi",
    "ecat-bench",
    "ecat-tracing",
    "ecat-registry-etcd",
    "ecat-mq-kafka",
    "ecat-data-opensearch",
    "ecat-data-influxdb",
    "ecat-transport-ws",
    "ecat-versioning",
    "examples/helloworld",
]
resolver = "2"

[workspace.package]
version = "2.1.3"
edition = "2024"
license = "Apache-2.0"


[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tonic-build = "0.12"
tower = "0.5"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
http = "1"
thiserror = "2"
