[package]
name = "ecat-data-sharding"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sharding catalog and validation for e-cat"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# 键绑定客户端要实现的 `SqlExecutor` / `RdbmsClient` 抽象。
ecat-data.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Snowflake 的 epoch（`OffsetDateTime`）与系统时钟。
time.workspace = true
# scatter 的 JoinSet / Semaphore / 总超时。tokio 原先只在 dev-dependencies 里。
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
# 测试里开启 preserve_order，让对象键的排序规范化成为可证伪的行为
# （默认 BTreeMap 本身有序，删掉排序测试也不会红）。
serde_json = { workspace = true, features = ["preserve_order"] }
# 异步 trait 测试用 `#[tokio::test]`（单线程 rt 即可）。
tokio = { workspace = true, features = ["macros", "rt"] }
