# cargo-audit 忽略规则（与 docs/dependency-cve-tracking.md 同步维护）。
# 原则：仅忽略已在跟踪文档完成暴露评估的项；新增 ignore 必须先补文档评估。
[advisories]
ignore = [
    # rsa 0.9.10 —— Marvin Attack 时序侧信道（无修复版）。
    # 仅经 sqlx-mysql 0.8.6 传递引入；它只用 RsaPublicKey::encrypt 做
    # caching_sha2_password 的密码加密（公钥运算），不执行私钥解密，
    # 因此不构成该时序侧信道的攻击面。
    "RUSTSEC-2023-0071",
]
