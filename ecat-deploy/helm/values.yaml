# standalone: 单 MySQL + Redis；distributed: ShardingSphere-Proxy + ClickHouse + 多副本 app。
deploymentMode: standalone

replicaCount: 3

# nodeId 从 Pod 字段注入（Deployment 用 valueFrom.fieldRef），不写死。
nodeId:
  fieldRef:
    fieldPath: metadata.name

image:
  repository: ecat-app
  tag: latest
  pullPolicy: IfNotPresent

mysql:
  # 集群内单实例样例；生产改用外部库时设 false。
  enabled: true
  database: bee_test
  image:
    repository: mysql
    tag: "8.4" # "8.4" 或 "9"

# 口令一律从 Secret 读取，values.yaml 不出现任何密码。
# Secret 需含 mysql-root-password（MySQL）与 mysql-dsn（应用）两个键。
existingSecret: ecat-secrets

service:
  type: ClusterIP
  httpPort: 8000
  grpcPort: 9000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

env:
  RUST_LOG: info

readinessProbe:
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 3
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
