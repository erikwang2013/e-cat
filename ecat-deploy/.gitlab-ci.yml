# tonic 0.14 / lapin 4 要求 Rust >= 1.88（edition 2024 另需 >= 1.85）。
image: rust:1.88

stages:
  - build
  - test
  - lint

variables:
  CARGO_TERM_COLOR: always

before_script:
  - apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler

cache:
  paths:
    - target/
    - $CARGO_HOME/

build:
  stage: build
  script:
    - cargo build --workspace

test:
  stage: test
  script:
    - cargo test --workspace

lint:
  stage: lint
  before_script:
    - apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler
    - rustup component add clippy rustfmt
  script:
    - cargo fmt --check
    - cargo clippy --workspace --all-targets -- -D warnings
