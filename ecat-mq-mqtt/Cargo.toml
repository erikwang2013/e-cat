[package]
name = "ecat-mq-mqtt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MQTT message queue backend for e-cat"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ecat-mq = { version = "10.0.0", path = "../ecat-mq" }
bytes.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# 走 native-tls：不再把 unmaintained 的 rustls-pemfile / 0.102 webpki 带进依赖树。
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"] }
native-tls = "0.2"

[dev-dependencies]
# 生成合法 CA / 客户端证书，覆盖 native-tls 的 PEM 解析路径。
ecat-tls = { path = "../ecat-tls" }
