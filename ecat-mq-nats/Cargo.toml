[package]
name = "ecat-mq-nats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NATS message queue backend for e-cat"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ecat-mq = { version = "9.0.0", path = "../ecat-mq" }
bytes.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-core.workspace = true
async-nats = "0.47"
# TLS 组装用：0.8 改用 rustls-pki-types，不再依赖已停止维护的 rustls-pemfile。
rustls-native-certs = "0.8"
# 显式声明 ring 特性：确保 rustls::crypto::ring 在任何特性合并组合下都存在
# （aws-lc-rs 由 tiberius 经 tokio-rustls 引入，两者并存时自动选 provider 会 panic）
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
