[package]
name = "ecat-data-mssql"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Microsoft SQL Server client for e-cat (tiberius-ng + deadpool)"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ecat-data = { version = "3.0.3", path = "../ecat-data" }
ecat-tls = { version = "3.0.3", path = "../ecat-tls" }
tiberius-ng = { workspace = true }
# `rt_tokio_1`：deadpool 默认**不开**任何运行时 feature，而池上设了
# wait/create/recycle 超时后 `PoolBuilder::build()` 会直接报 `NoRuntimeSpecified`
# （`deadpool-0.13.1/src/managed/builder.rs:90-98`），三个超时都靠这个 feature 生效。
deadpool = { workspace = true, features = ["rt_tokio_1"] }
tokio-util = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }
time = { workspace = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
