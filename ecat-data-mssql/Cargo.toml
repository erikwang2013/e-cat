[package]
name = "ecat-data-mssql"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Microsoft SQL Server client for e-cat (tiberius-ng + deadpool)"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ecat-data = { version = "6.0.0", path = "../ecat-data" }
ecat-tls = { version = "6.0.0", path = "../ecat-tls" }
tiberius-ng = { workspace = true }
# `rt_tokio_1`：deadpool 默认**不开**任何运行时 feature，而池上设了
# wait/create/recycle 超时后 `PoolBuilder::build()` 会直接报 `NoRuntimeSpecified`
# （`deadpool-0.13.1/src/managed/builder.rs:90-98`），三个超时都靠这个 feature 生效。
deadpool = { workspace = true, features = ["rt_tokio_1"] }
tokio-util = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }
time = { workspace = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
base64 = "0.22"
# 三个可观测性依赖都是 optional：默认不把 axum（ecat-metrics/ecat-health 的依赖）
# 拖进核心依赖树。
ecat-metrics = { workspace = true, optional = true }
ecat-health = { workspace = true, optional = true }
ecat-tracing = { workspace = true, optional = true }
# 批次 5a 起四个 `ecat_rdbms_*` 家族由 ecat-metrics 的唯一 collector 输出，本 crate
# 已零 prometheus 引用（`metrics` feature 里的 `dep:prometheus` 同理）。依赖按计划
# 保留 —— 换注册方式之外不改 Cargo.toml，清理留给后续批次（版本与 ecat-metrics 一致）。
prometheus = { version = "0.13", optional = true }

[features]
# 三个都默认关闭（spec:717-718）。`tracing` 只多拉 ecat-tracing ——
# `tracing` crate 本 crate 一直在用（pool.rs 的探活告警）。
metrics = ["dep:ecat-metrics", "dep:prometheus"]
health = ["dep:ecat-health"]
tracing = ["dep:ecat-tracing"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# 慢查询 warn 的捕获断言用（`MakeWriter`）。
tracing-subscriber = { workspace = true }
