[package]
name = "ecat-workflow-azkaban"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Azkaban workflow adapter for e-cat"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ecat-workflow = { version = "8.0.0", path = "../ecat-workflow" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }
# 登录后的 session 缓存要跨 await 持有。
tokio = { workspace = true, features = ["sync"] }
base64 = "0.22"

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "time"] }
