[package]
name = "ecat-mq-rabbitmq"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RabbitMQ message queue backend for e-cat"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ecat-mq = { version = "9.0.0", path = "../ecat-mq" }
bytes.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-core.workspace = true
# 4.x + native-tls：不再走 rustls 链路，彻底移除 unmaintained 的 rustls-pemfile。
lapin = { version = "4", default-features = false, features = ["native-tls", "tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
